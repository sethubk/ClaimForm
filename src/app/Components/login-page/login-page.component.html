<div class="login-wrapper">
  <div class="login-card">
    
    <h2 class="title">Expense Claim Portal</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <label>Email *</label>
      <input type="email" formControlName="empcode" />

      <p class="error" *ngIf="loginForm.get('empcode')?.touched && loginForm.get('empcode')?.invalid">
        Please enter a valid email address.
      </p>

      <label>Password *</label>
      <input type="password" formControlName="password" />

      <p class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        Password must be at least 8 characters, include letters and numbers.
      </p>

      <div class="options">
        
      </div>

      <button type="submit" [disabled]="loginForm.invalid"> <span *ngIf="!loading">Login</span>
    <span *ngIf="loading">Loading...</span></button>

      <p class="error">{{ errorMessage }}</p>

    </form>

  </div>
</div>
